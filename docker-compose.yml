services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SIGNALING_URL=ws://localhost:8080/ws
        - VITE_MEDIA_SERVER_URL=http://localhost:8080
        - VITE_PUSH_SERVICE_URL=http://localhost:8082
    container_name: mip-frontend
    ports:
      - "3000:3000"
    depends_on:
      media:
        condition: service_started
      workers:
        condition: service_started
    restart: unless-stopped

  media:
    build:
      context: ./media
      dockerfile: Dockerfile
    container_name: mip-media
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - PORT=8080
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: mip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181", "|", "grep", "imok"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: mip-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: mip-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh
    entrypoint: [ "bash", "/init-topics.sh" ]

  postgres:
    image: postgres:15-alpine
    container_name: mip-postgres
    environment:
      - POSTGRES_USER=meeting
      - POSTGRES_PASSWORD=meeting
      - POSTGRES_DB=meetingdb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meetingdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  workers:
    build:
      context: ./workers
    container_name: mip-workers
    ports:
      - "8082:8082"
    env_file:
      - ./workers/.env
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS_URL=redis://redis:6379
      - POSTGRES_USER=meeting
      - POSTGRES_PASSWORD=meeting
      - POSTGRES_DB=meetingdb
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    command: uvicorn app.entrypoints.main:app --host 0.0.0.0 --port 8082
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
